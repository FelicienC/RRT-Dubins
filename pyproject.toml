[tool.poetry]
name = "rrt-dubins"
version = "0.1.1"
description = "Simple implementation of a Rapidly Exploring Random Tree using Dubins path as an expansion method"
authors = ["FelicienC <cantalloubef@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
scipy = "^1.12.0"
shapely = "^2.0.3"
numpy = "^1.26.4"
rtree = "^1.2.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.3.3"
matplotlib = "^3.5.1"
pre-commit = "^4.0.1"
codespell = "^2.3.0"
pytest-cov = "^6.0.0"
conventional-pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
